[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-utils"
version = "3.1.2"
description = "Import mail messages from [Gmail|Outlook archive|Thunderbird archive] into SQLite database from where they can be exported to files"
authors = [{name="Giovanni Pellicciotta", email="giovanni.pellicciotta@gmail.com"}]
readme = "README.md"
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/gpellicciotta/mail-utils"
Changelog = "https://github.com/gpellicciotta/mail-utils/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "build>=1.0.0"]

[project.scripts]
mail-utils = "mail_utils.cli:main"

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
