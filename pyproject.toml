[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-utils"
version = "2.2.0"
description = "Import mail messages from [Gmail|Outlook archive|Thunderbird archive] into SQLite database from where they can be exported to files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "build>=1.0.0"]

[project.scripts]
mail-utils = "mail_utils.cli:main"

[tool.ruff]
line-length = 132
